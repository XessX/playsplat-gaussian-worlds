project:
  name: playsplat
  scene_id: demo_scene

input:
  path: null
  format: gaussian-splat

output:
  directory: outputs

gaussian:
  visual_layer:
    enabled: true
    preserve_original_splats: true

geometry:
  proxy:
    enabled: true
    method: placeholder_density_surface
    target_face_count: 50000
    opacity_threshold: 0.01
    bounds_quantile: 0.995
    max_gaussians: 300000
    voxel_size: 0.05
    density_threshold: 1.0
    padding_voxels: 2
    smooth_sigma: 0.0
    max_grid_voxels: 20000000
    output_mesh: proxy_mesh.obj

physics:
  collision:
    enabled: true
    mode: static
    primitive_budget: 1024

navigation:
  walkable:
    enabled: true
    agent_radius: 0.4
    max_slope_degrees: 35.0

semantics:
  enabled: true
  vocabulary:
    - floor
    - wall
    - door
    - chair
    - table
    - stairs
    - obstacle

affordance:
  enabled: true
  labels:
    - walkable
    - climbable
    - sittable
    - movable
    - openable
    - interactable

export:
  enabled: true
  targets:
    - unity
    - playcanvas
    - webgl
