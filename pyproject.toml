[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "playsplat"
version = "0.1.0"
description = "Playability-aware Gaussian splatting research prototype for physics-ready interactive 3D worlds."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "PlaySplat Research Team" }
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.24",
  "plyfile>=1.0",
  "PyYAML>=6.0",
  "scikit-image>=0.22",
  "scipy>=1.11",
  "tqdm>=4.66",
  "trimesh>=4.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.10"
]
capture = [
  "opencv-python>=4.8",
  "Pillow>=10.0"
]

[project.scripts]
playsplat = "playsplat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = [
  "plyfile",
  "scipy",
  "scipy.ndimage",
  "skimage",
  "skimage.measure",
  "mpl_toolkits.mplot3d",
  "trimesh",
  "yaml"
]
ignore_missing_imports = true
